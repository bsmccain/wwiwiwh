<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>mapz</title>
    <meta
      name="description"
      content="Lay the street map of a place you know over a place you are curious about, at the same scale, and see how far things really are."
    />
    <!-- The browser's own chrome continues the sheet. Keep in step with src/app/theme.ts. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1c2e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>mapz draws its maps with JavaScript. Turn it on to lay one place over another.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
