<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>wwiwiwh</title>
    <meta
      name="description"
      content="Lay the street map of a place you know over a place you are curious about, at the same scale, and see how far things really are."
    />
    <!-- The browser's own chrome continues the sheet. Keep in step with src/app/theme.ts. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1c2e" />
    <!--
      The tab icon is the mark on a clear ground, in the printing for the system's light or dark setting;
      favicon.ico (the light printing) is for browsers that ignore media. Home-screen icons keep an opaque
      square, since iOS fills a clear ground with black.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>wwiwiwh draws its maps with JavaScript. Turn it on to lay one place over another.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
